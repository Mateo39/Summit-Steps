/* Sum Splash */
function startSum(){
  gm={id:'sum',stage:'play',left:60,correct:0,wrong:0,combo:0,best:0,score:0,q:sumQ(1),lock:false,flash:null};
  view='game';render();window.scrollTo(0,0);
  stopTimer();
  timerId=setInterval(()=>{
    if(!gm||gm.id!=='sum'||gm.stage!=='play'){stopTimer();return;}
    gm.left--;const t=$('#gtimer');
    if(t){t.textContent=String(Math.max(0,gm.left));t.parentNode.classList.toggle('low',gm.left<=10);}
    if(gm.left<=0)endSum();
  },1000);
}
function sumAnswer(o){
  const g=gm;if(!g||g.stage!=='play'||g.lock)return;
  const ok=o===g.q.a;g.lock=true;g.flash={opt:o,ok};
  if(ok){g.correct++;g.combo++;g.best=Math.max(g.best,g.combo);g.score+=10+2*Math.min(g.combo,10);}
  else{g.wrong++;g.combo=0;g.left=Math.max(0,g.left-3);}
  render();
  setTimeout(()=>{
    if(gm!==g||g.stage!=='play')return;
    if(g.left<=0){endSum();return;}
    g.q=sumQ(1+Math.floor(g.correct/6));g.lock=false;g.flash=null;render();
  },ok?350:1000);
}
function endSum(){
  const g=gm;if(!g||g.id!=='sum'||g.stage==='end')return;
  stopTimer();g.stage='end';
  const prev=((progress.games||{}).sum||{}).high||0;
  g.stars=g.correct>=22?3:g.correct>=15?2:g.correct>=8?1:0;g.newBest=g.correct>prev;
  finishGame('sum',g.stars,{high:g.correct});render();
}
function sumView(){
  const g=gm;
  if(g.stage==='end')return endView('Time’s up!',`${g.correct} correct`,[`Score ${g.score}. Longest combo: ${g.best} in a row.`,g.newBest?'That is a new personal best!':`Your best is ${((progress.games||{}).sum||{}).high||0} correct.`,'Stars: 8 correct for one, 15 for two, 22 for three.'],g.stars,startSum);
  const q=g.q;
  const wrap=h('section',{class:'session'},frame('Sum Splash',h('div',{class:'timer'+(g.left<=10?' low':''),'aria-label':'Seconds left'},h('span',{id:'gtimer'},String(Math.max(0,g.left))),' s')));
  wrap.append(h('div',{class:'gstats'},
    h('span',{class:'gstat'},'Score ',h('b',null,String(g.score))),
    h('span',{class:'gstat'},'Combo ',h('b',null,'×'+g.combo)),
    h('span',{class:'gstat'},'Level ',h('b',null,String(1+Math.min(2,Math.floor(g.correct/6)))))));
  const box=h('div',{class:'qbox'},h('div',{class:'bigq','aria-live':'polite'},q.q),
    h('div',{class:'opts2'},q.opts.map((o,i)=>{
      let cls='opt';if(g.flash){if(o===q.a)cls+=' right';else if(o===g.flash.opt)cls+=' wrong';}
      return h('button',{class:cls,disabled:g.lock,'aria-keyshortcuts':String(i+1),onclick:()=>sumAnswer(o)},String(o));
    })));
  if(g.flash)box.append(h('div',{class:'pop '+(g.flash.ok?'ok':'no'),role:'status'},g.flash.ok?pick(PRAISE):`Oops, the answer was ${q.a}. You lose 3 seconds.`));
  else box.append(h('p',{class:'note'},'Tip: on a keyboard, press 1, 2, 3 or 4. A wrong answer costs 3 seconds.'));
  wrap.append(box);return wrap;
}

/* Summit Quiz */
function startClimb(subj){
  gm={id:'climb',stage:'play',subj,pos:0,asked:0,used:{},q:null,sel:null,hidden:[],fifty:true,summit:false,last:null,note:''};
  nextClimbQ();view='game';render();window.scrollTo(0,0);
}
function nextClimbQ(){
  const g=gm,t=g.subj==='mix'?pick(['sci','geo','hist','art']):g.subj;
  g.used[t]=g.used[t]||new Set();g.q=topicQ(BANKS[t],g.used[t],'mc');g.q.t=t;g.sel=null;g.hidden=[];g.asked++;
}
function climbAnswer(o){
  const g=gm;if(!g||g.sel!==null)return;
  g.sel=o;const ok=o===g.q.a,prev=g.pos;g.last=ok?'up':'down';
  g.pos=ok?Math.min(10,g.pos+1):Math.max(0,g.pos-1);
  if(g.pos===10)g.summit=true;
  g.note=ok?(g.summit?'You planted the flag at the summit!':`Up to camp ${g.pos}.`):(prev>0?`You slip back to camp ${g.pos}.`:'You stay at camp 0.');
  render();setTimeout(()=>{const n=$('#climbnext');if(n)n.focus({preventScroll:true});},30);
}
function useFifty(){
  const g=gm;if(!g||!g.fifty||g.sel!==null)return;
  g.hidden=shuf(g.q.opts.filter(o=>o!==g.q.a)).slice(0,2);g.fifty=false;g.last=null;render();
}
function climbNext(){
  const g=gm;if(g.summit||g.asked>=16){endClimb();return;}
  nextClimbQ();g.last=null;render();
  setTimeout(()=>{const e=$('.opt:not(:disabled)');if(e)e.focus({preventScroll:true});},30);
}
function endClimb(){
  const g=gm;g.stage='end';g.stars=g.summit?(g.asked<=12?3:2):(g.pos>=6?1:0);finishGame('climb',g.stars);render();
}
function climbSvg(pos,hopCls){
  const pts=CAMPS.map(p=>p.join(',')).join(' ');
  const dots=CAMPS.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" style="fill:${i<=pos?'var(--accent)':'var(--surface)'};stroke:var(--ink)" stroke-width="2"/>`).join('');
  const [x,y]=CAMPS[pos],gx=pos===10?x-52:x-19;
  return svg(`<svg class="mtn" viewBox="0 -24 300 224" role="img" aria-label="Mountain with 10 camps. Skip the goat is at camp ${pos}.">
   <polygon points="10,190 150,15 290,190" style="fill:var(--m1);stroke:var(--ink)" stroke-width="3" stroke-linejoin="round"/>
   <polygon points="150,15 128,48 141,42 150,52 160,42 173,48" style="fill:var(--snow);stroke:var(--ink)" stroke-width="2" stroke-linejoin="round"/>
   <polyline points="${pts}" fill="none" style="stroke:var(--ink)" stroke-width="3" stroke-dasharray="1 8" stroke-linecap="round"/>
   ${dots}
   <path d="M150 15V-20" style="stroke:var(--ink)" stroke-width="3" stroke-linecap="round"/>
   <path d="M150 -20l24 9-24 9z" style="fill:var(--hat);stroke:var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
   <use href="#goat" class="${hopCls||''}" x="${gx}" y="${y-38}" width="40" height="40"/>
  </svg>`);
}
function climbView(){
  const g=gm,sj=CLIMB_SUBJ.find(s=>s[0]===g.subj);
  if(g.stage==='end')return endView(g.summit?'You reached the summit!':'The sun is setting',g.summit?`${g.asked} questions`:`Camp ${g.pos} of 10`,
    [g.summit?(g.asked<=12?'A fast climb! Twelve questions or fewer earns three stars.':'Reach the summit in twelve questions or fewer for three stars.'):'Reach camp 10 to plant the flag. You have 16 questions before dark.'],g.stars,()=>openGame('climb'));
  const q=g.q,done=g.sel!==null;
  const left=h('div',{class:'stack',style:'gap:12px'},climbSvg(g.pos,g.last==='up'?'hop':''),
    h('div',{class:'gstats'},h('span',{class:'gstat'},'Camp ',h('b',null,g.pos+' / 10')),h('span',{class:'gstat'},'Question ',h('b',null,g.asked+' / 16'))));
  const box=h('div',{class:'qbox'},h('span',{class:'ptag'},sj[1]),h('div',{class:'qtext'},q.q),
    h('div',{class:'opts'},q.opts.map((o,oi)=>{
      if(g.hidden.includes(o))return null;
      let cls='opt',lab='';
      if(done){if(o===q.a){cls+=' right';lab='Correct answer';}else if(o===g.sel){cls+=' wrong';lab='Your answer';}}
      return h('button',{class:cls,disabled:done,onclick:()=>climbAnswer(o)},h('span',{class:'ol','aria-hidden':'true'},'ABCD'[oi]),h('span',{class:'tx'},o),lab?h('span',{class:'lab'},lab):null);
    })));
  if(!done)box.append(h('div',{class:'row'},h('button',{class:'ghost',disabled:!g.fifty,onclick:useFifty,'aria-label':'50/50: remove two wrong answers. One use per climb.'},g.fifty?'50/50 lifeline':'50/50 used')));
  else{
    const ok=g.sel===q.a;
    box.append(h('div',{class:'fb '+(ok?'ok':'no'),role:'status'},h('strong',null,ok?pick(PRAISE):'Not quite. The answer is '+q.a+'.'),h('p',null,q.ex),h('p',null,g.note)));
    box.append(h('div',{class:'row'},h('button',{class:'btn',id:'climbnext',onclick:climbNext},(g.summit||g.asked>=16)?'See results':'Next question')));
  }
  return h('section',{class:'session'},frame('Summit Quiz'),h('div',{class:'climbwrap'},left,box));
}

/* Match Up */
function startMatch(deck){
  gm={id:'match',stage:'play',deck,cards:buildMatch(deck),open:[],done:new Set(),moves:0,lock:false};
  view='game';render();window.scrollTo(0,0);
}
function flip(i){
  const g=gm;if(!g||g.lock||g.stage!=='play'||g.done.has(g.cards[i].pair)||g.open.includes(i))return;
  g.open.push(i);
  if(g.open.length===2){
    g.moves++;const [a,b]=g.open;
    if(g.cards[a].pair===g.cards[b].pair){
      g.done.add(g.cards[a].pair);g.open=[];
      if(g.done.size===g.cards.length/2){endMatch();return;}
    }else{
      g.lock=true;render();
      setTimeout(()=>{if(gm!==g)return;g.open=[];g.lock=false;render();},1000);
      return;
    }
  }
  render();
}
function endMatch(){
  const g=gm;g.stage='end';g.stars=g.moves<=8?3:g.moves<=12?2:1;finishGame('match',g.stars);render();
}
function matchView(){
  const g=gm,dk=MATCH_DECKS.find(d=>d.id===g.deck);
  if(g.stage==='end')return endView('All matched!',`${g.moves} moves`,['Fewer moves earn more stars: 8 or fewer for three, 12 or fewer for two.'],g.stars,()=>startMatch(g.deck));
  const grid=h('div',{class:'mgrid'},g.cards.map((c,i)=>{
    const matched=g.done.has(c.pair),up=matched||g.open.includes(i);
    return h('button',{class:'mcard '+(up?'up':'down')+(matched?' ok':''),disabled:matched,'aria-label':up?c.text:`Card ${i+1}, face down`,onclick:()=>flip(i)},up?c.text:null);
  }));
  return h('section',{class:'session'},
    frame('Match Up: '+dk.name,h('span',{class:'gstat'},'Moves ',h('b',null,String(g.moves)))),
    h('p',{class:'muted'},dk.blurb),grid,
    h('p',{class:'note'},`${g.done.size} of ${g.cards.length/2} pairs found.`));
}

/* Spell Rescue */
function startSpell(){
  gm={id:'spell',stage:'play',words:shuf(SPELL_WORDS).slice(0,5),i:0,guessed:new Set(),lives:7,state:'play',saved:0};
  view='game';render();window.scrollTo(0,0);
}
const spellWord=()=>gm.words[gm.i][0].toUpperCase();
function spellCheckWin(){const g=gm;if([...spellWord()].every(c=>g.guessed.has(c))){g.state='won';g.saved++;}}
function guessLetter(L){
  const g=gm;if(!g||g.state!=='play'||g.guessed.has(L))return;
  g.guessed.add(L);
  if(spellWord().includes(L))spellCheckWin();
  else{g.lives--;if(g.lives<=0)g.state='lost';}
  render();
}
function revealLetter(){
  const g=gm;if(!g||g.state!=='play'||g.lives<2)return;
  const c=[...spellWord()].find(ch=>!g.guessed.has(ch));g.guessed.add(c);g.lives--;spellCheckWin();render();
}
function spellNext(){
  const g=gm;g.i++;
  if(g.i>=g.words.length){g.stage='end';g.stars=g.saved>=5?3:g.saved>=4?2:g.saved>=2?1:0;finishGame('spell',g.stars);render();return;}
  g.guessed=new Set();g.lives=7;g.state='play';render();
}
function spellView(){
  const g=gm;
  if(g.stage==='end')return endView('Rescue complete!',`${g.saved} of ${g.words.length} saved`,['Save all five for three stars, four for two, or two or three for one.'],g.stars,startSpell);
  const w=spellWord(),clue=g.words[g.i][1],lost=g.state==='lost';
  const box=h('div',{class:'qbox'},
    h('p',null,h('b',null,'Clue: '),clue),
    h('div',{class:'wordrow',role:'img','aria-label':`Word with ${w.length} letters: `+[...w].map(c=>g.guessed.has(c)||lost?c:'blank').join(' ')},
      [...w].map(c=>{const sh=g.guessed.has(c);return h('span',{class:'slot'+(lost&&!sh?' miss':'')},sh||lost?c:'');})),
    h('div',{class:'row',style:'justify-content:center'},h('span',{class:'note'},'Rope strength'),
      h('span',{class:'rope',role:'img','aria-label':`${g.lives} of 7 left`},Array.from({length:7},(_,k)=>h('i',{class:k<g.lives?'':'off'})))),
    h('div',{class:'kbd',role:'group','aria-label':'Letters'},'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(L=>{
      const used=g.guessed.has(L),hit=used&&w.includes(L);
      return h('button',{class:'key'+(used?(hit?' hit':' miss'):''),disabled:used||g.state!=='play',onclick:()=>guessLetter(L)},L);
    })));
  if(g.state==='play')box.append(h('div',{class:'row',style:'justify-content:center'},h('button',{class:'ghost',disabled:g.lives<2,onclick:revealLetter},'Reveal a letter (costs 1 rope)')));
  else{
    box.append(h('div',{class:'fb '+(lost?'no':'ok'),role:'status'},h('strong',null,lost?`Not this time. The word was ${w.toLowerCase()}.`:`Rescued! ${w.toLowerCase()} is spelt correctly.`)));
    box.append(h('div',{class:'row'},h('button',{class:'btn',id:'spellnext',onclick:spellNext},g.i+1>=g.words.length?'See results':'Next word')));
  }
  return h('section',{class:'session'},frame('Spell Rescue',h('span',{class:'gstat'},'Word ',h('b',null,`${g.i+1} / ${g.words.length}`))),box);
}

/* Sort It */
function startSort(deck){
  gm={id:'sort',stage:'play',deck,cards:buildSort(deck),i:0,right:0,streak:0,best:0,fb:null};
  view='game';render();window.scrollTo(0,0);
}
function sortPick(b){
  const g=gm;if(!g||g.stage!=='play'||g.fb)return;
  const ok=b===g.cards[g.i].bucket;g.fb={ok,b};
  if(ok){g.right++;g.streak++;g.best=Math.max(g.best,g.streak);}else g.streak=0;
  render();
  if(ok)setTimeout(()=>{if(gm===g&&g.fb&&g.fb.ok)sortNext();},700);
  else setTimeout(()=>{const n=$('#sortnext');if(n)n.focus({preventScroll:true});},30);
}
function sortNext(){
  const g=gm;g.i++;g.fb=null;
  if(g.i>=g.cards.length){g.stage='end';g.stars=g.right>=11?3:g.right>=9?2:g.right>=6?1:0;finishGame('sort',g.stars);}
  render();
}
function sortView(){
  const g=gm,dk=SORT_DECKS.find(d=>d.id===g.deck);
  if(g.stage==='end')return endView('Round complete!',`${g.right} / ${g.cards.length}`,[`Longest streak: ${g.best} in a row.`,'Eleven right for three stars, nine for two, six for one.'],g.stars,()=>startSort(g.deck));
  const c=g.cards[g.i];
  const card=h('div',{class:'sortcard'+(g.fb&&!g.fb.ok?' shake':''),'aria-live':'polite'},c.swatch?h('span',{class:'swatch',style:'background:'+c.swatch}):null,h('span',null,phrase(c.text)));
  const bk=h('div',{class:'buckets'},dk.buckets.map((n,b)=>h('button',{class:'bucket',style:'--c:var(--'+BUCKET_COLS[b]+')',disabled:!!g.fb,'aria-keyshortcuts':String(b+1),onclick:()=>sortPick(b)},n)));
  const wrap=h('section',{class:'session'},
    frame('Sort It: '+dk.name,h('span',{class:'gstat'},'Streak ',h('b',null,String(g.streak)))),
    h('p',{class:'muted'},dk.blurb+` Card ${g.i+1} of ${g.cards.length}.`),card,bk);
  if(g.fb){
    if(g.fb.ok)wrap.append(h('div',{class:'pop ok',role:'status'},pick(PRAISE)));
    else wrap.append(h('div',{class:'pop no',role:'status'},h('p',null,h('b',null,`That goes in “${dk.buckets[c.bucket]}”. `),c.why)),
      h('div',{class:'row'},h('button',{class:'btn',id:'sortnext',onclick:sortNext},g.i+1>=g.cards.length?'See results':'Next card')));
  }else wrap.append(h('p',{class:'note'},'Tip: on a keyboard, press 1, 2 or 3.'));
  return wrap;
}

/* Sentence Builder */
function startSent(){
  gm={id:'sent',stage:'play',items:shuf(SENTS).slice(0,5),i:0,first:0};setupSent();
  view='game';render();window.scrollTo(0,0);
}
function setupSent(){
  const g=gm,s=g.items[g.i][0],toks=s.split(' ').map((t,k)=>({t,k}));
  let sh,n=0;do{sh=shuf(toks);n++;}while(sh.map(x=>x.t).join(' ')===s&&n<10);
  g.bank=sh;g.tray=[];g.tries=0;g.solved=false;g.msg='';
}
function sentAdd(k){
  const g=gm;if(!g||g.solved)return;const i=g.bank.findIndex(x=>x.k===k);if(i<0)return;
  g.tray.push(g.bank.splice(i,1)[0]);g.msg='';render();
  setTimeout(()=>{const e=$('.bank .wchip')||$('#sentcheck');if(e)e.focus({preventScroll:true});},20);
}
function sentRemove(k){
  const g=gm;if(!g||g.solved)return;const i=g.tray.findIndex(x=>x.k===k);if(i<0)return;
  g.bank.push(g.tray.splice(i,1)[0]);g.msg='';render();
  setTimeout(()=>{const e=$('.tray .wchip')||$('.bank .wchip');if(e)e.focus({preventScroll:true});},20);
}
function sentClear(){const g=gm;if(!g||g.solved)return;g.bank=g.bank.concat(g.tray);g.tray=[];g.msg='';render();}
function sentCheck(){
  const g=gm;if(!g||g.solved||!g.tray.length)return;
  if(g.bank.length){g.msg='Use every word before you check.';render();return;}
  if(g.tray.map(x=>x.t).join(' ')===g.items[g.i][0]){g.solved=true;if(g.tries===0)g.first++;g.msg='';}
  else{g.tries++;g.msg='Not quite. Read it aloud. Does it sound right and make sense?';}
  render();setTimeout(()=>{const n=$('#sentnext');if(n)n.focus({preventScroll:true});},30);
}
function sentNext(){
  const g=gm;g.i++;
  if(g.i>=g.items.length){g.stage='end';g.stars=g.first>=5?3:g.first>=4?2:g.first>=2?1:0;finishGame('sent',g.stars);render();return;}
  setupSent();render();
}
function sentView(){
  const g=gm;
  if(g.stage==='end')return endView('Sentences built!',`${g.first} of ${g.items.length} first try`,['Get all five right first time for three stars, four for two, or two or three for one.'],g.stars,startSent);
  const [s,note]=g.items[g.i];
  const wrap=h('section',{class:'session'},frame('Sentence Builder',h('span',{class:'gstat'},'Sentence ',h('b',null,`${g.i+1} / ${g.items.length}`))));
  const box=h('div',{class:'qbox'},h('p',null,'Tap the words in the right order to build a sentence. Tap a word in your sentence to take it back.'),
    h('div',{class:'tray',role:'group','aria-label':'Your sentence'},g.tray.map(x=>h('button',{class:'wchip','aria-label':'Remove '+x.t,disabled:g.solved,onclick:()=>sentRemove(x.k)},x.t))),
    h('div',{class:'bank',role:'group','aria-label':'Words to use'},g.bank.map(x=>h('button',{class:'wchip',onclick:()=>sentAdd(x.k)},x.t))));
  if(!g.solved)box.append(h('div',{class:'row'},h('button',{class:'btn',id:'sentcheck',disabled:!g.tray.length,onclick:sentCheck},'Check'),h('button',{class:'ghost',disabled:!g.tray.length,onclick:sentClear},'Clear')));
  if(g.msg)box.append(h('div',{class:'pop no',role:'status'},g.msg));
  if(g.tries>=2&&!g.solved)box.append(h('p',{class:'hint'},`Hint: it starts with “${s.split(' ')[0]}”.`));
  if(g.solved){
    box.append(h('div',{class:'fb ok',role:'status'},h('strong',null,g.tries===0?'Perfect, first try!':'You got it!'),h('p',null,note)));
    box.append(h('div',{class:'row'},h('button',{class:'btn',id:'sentnext',onclick:sentNext},g.i+1>=g.items.length?'See results':'Next sentence')));
  }
  wrap.append(box);return wrap;
}

document.addEventListener('keydown',e=>{
  if(view!=='game'||!gm||e.ctrlKey||e.metaKey||e.altKey)return;
  const tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
  const k=e.key;
  if(gm.id==='sum'&&gm.stage==='play'&&/^[1-4]$/.test(k)){const o=gm.q.opts[+k-1];if(o!==undefined)sumAnswer(o);}
  else if(gm.id==='spell'&&gm.stage==='play'&&gm.state==='play'&&/^[a-z]$/i.test(k))guessLetter(k.toUpperCase());
  else if(gm.id==='sort'&&gm.stage==='play'&&!gm.fb&&/^[1-3]$/.test(k)){const dk=SORT_DECKS.find(d=>d.id===gm.deck);if(+k-1<dk.buckets.length)sortPick(+k-1);}
});

render();
initStore();
